<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء فريق | بوصلة</title>
    <link rel="icon" type="image/jpg" href="../assets/icons/icon.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'b-bg': '#000000', 'b-surface': '#111111', 'b-primary': '#006A67' },
                    fontFamily: { 'cairo': ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>body { font-family: 'Cairo', sans-serif; background-color: #000; }</style>
</head>
<body class="bg-b-bg text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-b-surface p-8 rounded-2xl border border-white/10 shadow-2xl relative">
        <a href="student-dash.html" class="absolute top-6 left-6 text-gray-400 hover:text-white transition-colors">
            <i class="fas fa-arrow-left text-xl"></i>
        </a>

        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-b-primary/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-users-cog text-3xl text-b-primary"></i>
            </div>
            <h1 class="text-3xl font-bold mb-2">طلب إنشاء فريق أكاديمي</h1>
            <p class="text-gray-400">كن قائداً وابدأ رحلة التعلم مع زملائك في بيئة منظمة.</p>
        </div>

        <form id="create-team-form" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">اسم الفريق</label>
                    <input type="text" id="team-name" required placeholder="مثال: Digital Minds" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white outline-none focus:border-b-primary transition-colors">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">رابط الشعار (Logo URL)</label>
                    <input type="url" id="team-logo" placeholder="https://..." class="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white outline-none focus:border-b-primary transition-colors">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">الجامعة</label>
                    <input type="text" id="uni-name" required placeholder="مثال: جامعة الزقازيق" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white outline-none focus:border-b-primary transition-colors">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">المحافظة</label>
                    <select id="gov-name" required class="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white outline-none focus:border-b-primary transition-colors">
                        <option value="" disabled selected>اختر المحافظة</option>
                        <option value="Cairo">القاهرة</option>
                        <option value="Giza">الجيزة</option>
                        <option value="Alexandria">الإسكندرية</option>
                        <option value="Sharqia">الشرقية</option>
                        <option value="Dakahlia">الدقهلية</option>
                        <option value="Other">أخرى</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">عدد الأعضاء المتوقع (شاملاً القائد)</label>
                <input type="number" id="members-count" max="5" min="2" required placeholder="من 2 إلى 5" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white outline-none focus:border-b-primary transition-colors">
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">لماذا تريد إنشاء الفريق؟ (لمنع الـ Spam)</label>
                <textarea id="reason" rows="3" required placeholder="اكتب نبذة مختصرة عن هدفك..." class="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white outline-none focus:border-b-primary transition-colors"></textarea>
            </div>

            <div id="form-msg" class="hidden p-4 rounded-xl text-center text-sm font-bold"></div>

            <button type="submit" id="submit-btn" class="w-full bg-b-primary hover:bg-teal-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg shadow-b-primary/20 transition-all flex items-center justify-center gap-2">
                <span>إرسال الطلب للمراجعة</span>
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <script type="module" src="../js/create-team.js"></script>
</body>
</html>
